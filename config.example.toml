timezone = "Europe/Moscow"
data_dir = "data"                       # relative to repo root, or absolute

[playerok]
rate_static_rub_per_100k = 400
rate_voiced_rub_per_100k = 700
min_paid_views = 50000
step_views = 50000
max_payout_rub = 10000
deadline_days = 21                      # counted from publication time (owner: confirm the reference point)
submit_by_day = 19
stall_growth_pct_48h = 5.0
screen_recording_views = 500000
wait_for_next_step = true               # stalled but projected to cross next 50k step within 48 h -> wait
risk_min_views = 50000                  # addendum 3: from here, low engagement is flagged "риск отказа"
risk_min_engagement_pct = 1.0           # (likes + comments) / views * 100 below this -> risk (tune on the pilot)
limit_alert_used_pct = 50               # author limit (one for the network): alert above this share used

[banners]
# Playerok creatives (Nov 2026) are full-frame canvases: the top banner 2000x1920 with transparency,
# scaled to the frame width; the midrolls 1080x1920 with sound, drawn over the frozen frame.
top_fit = "width"                       # "width": scale to the frame width (Playerok canvases); "height": to top_height_px
top_y = 0                               # px from the top edge where the canvas starts (check the preview frames)
top_height_px = 360                     # only for top_fit = "height" (small stickers)
top_min_height_px = 320                 # the visible banner (measured from its transparency) is >= 1920/6
midroll_box = { x = 0, y = 0, w = 1080 }     # where the midroll is drawn on the frozen frame; height keeps aspect
midroll_min_source_sec = 12
midroll_short_until_sec = 20
midroll_short_insert_sec = 10           # clamped to <= duration - 3 (10 also satisfies the 10-20 s rule)
midroll_long_window_sec = [10, 20]
midroll_long_insert_sec = 12
# Playerok banner sets with dates (addendum 3). The set valid today (Moscow time) is used. After the last
# one ends, building stops and Telegram gets an alert once a day until a new set is added here.
# Load a new set once with:  python -m clips import-banners --name "..." --top gta1.mov --start ... --end ...
# It re-encodes the ProRes 4444 .mov files to light WebM with transparency, deletes the sources and prints the block.
# Fallback without .mov: the .mp4 files with their background color: { file = "...mp4", chroma = "#13FF08",
# similarity = 0.15, blend = 0.05, duration = 12.25 }.
# Only Playerok banners: never another advertiser's banner or any other ad on these accounts.
[[banners.sets]]
name = "GTA VI"                         # 01.11-30.11.2026 the GTA VI version is mandatory
platform = "instagram"
start = 2026-11-01
end = 2026-11-30
top = { file = "assets/banners/gta-vi/top.webm", duration = 12.25 }      # gta1.mov; looped, reels shorter are rejected
midrolls = []                           # owner: static banner only, no voiced midroll (do not add midroll1-3)

[[banners.sets]]
name = "Instagram"                      # standard banner after the GTA VI month; no end date from Playerok
platform = "instagram"
start = 2026-12-01
top = { file = "assets/banners/instagram/top.webm", duration = 12.25 }   # instagram1.mov
midrolls = []

[compose]
width = 1080
height = 1920
fps = 30
circle_diameter = 990                   # like the reference accounts (smexouzavr, hihiks.tv): ~92% of the width
circle_center_y = 1150                  # the banner is drawn over the circle's top edge, never under it
background_every = 20                   # circle: reels per background image when the account's background is a folder
background_variation = true             # each reel (and its cover) gets its own version: mirror, zoom, shift, light
circle_border_px = 3                    # thin ring around the circle, 0 disables
circle_border_color = "#FFFFFF"
square_size = 1080                      # template "square": video cropped to a centered square, black background
square_top_y = 660                      # below the top banner
square_text_y = 1770                    # text plate on the square template: in the black margin below the video
crf = 20
preset = "medium"
audio_bitrate = "128k"
max_file_mb = 100
font_file = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
text_overlay = false                    # optional text plate (spec module 7, optional)
text_y = 1660                           # below the circle
text_size = 56
banner_check_max_diff = 8.0             # mean abs pixel diff (0-255) between banner and its area in the reel

[compose.safe_zone]                     # px of a 1080x1920 reel covered by Instagram's UI; the banner stays out
top = 269                               # "Reels" header (14%); third-party guides, Meta publishes no numbers
bottom = 672                            # nick, caption, music (35%)
left = 65
right = 120                             # like / comment / share buttons

[trends]
# Picked 18.11.2026 from 30 meme pages found by Russian meme hashtags (docs/DONORS.md): typical views 3k-229k
donors = ["hermesqz", "hu1iganyo", "ramzik.krsk24", "top.leym", "daring_555", "axyennyi_tip", "meme.actually"]
donors_movies = ["callmeayub_17"]       # Russian film/series cuts (donor_group "movies", addendum 2b)
voiced_priority = true                  # bonus for 12 s+ sources; has no effect while banner sets have no midrolls
share_weight = true                     # rank by shares/views too, when Apify returns sharesCount
blocked_donors = []
fresh_days = 3                          # Apify onlyPostsNewerThan for regular fetches
seed_results = 30                       # reels fetched for a donor with too little history
results_per_donor = 15
max_age_hours = 48
min_views = 100000
views_to_median_ratio = 2.0
median_window = 30                      # last N mature reels of the donor
min_donor_samples = 8
min_duration_sec = 5                    # sources shorter than the banner loop are rejected separately
max_duration_sec = 90

[filter]
# Playerok pays only for Russian content: after download, a clip with clear speech in another language is
# rejected (reason speech_<lang>). Clips without speech (music, sounds) pass. On-screen text is not checked.
speech_check = true
speech_langs = ["ru"]
speech_min_prob = 0.6                   # below this the language guess is unsure: the clip passes
speech_model = "base"                   # faster-whisper model, ~140 MB, downloaded once on first use
# Python regexes, matched against caption lowercased with "ё" replaced by "е". Starter list: tune it.
blocked_patterns = [
  # crime, gangs
  '\bубий', '\bубив', '\bограб', '\bграбеж', '\bтюрьм', '\bзэк', '\bбандит', '\bбанд[аыу]\b', '\bауе\b', '\bкримин', '\bтеррор', '\bстрельб',
  # war, military
  '\bвойн[аыуе]\b', '\bвоенн', '\bсво\b', '\bвсу\b', '\bфронт', '\bарми[яи]', '\bмобилиз', '\bракет',
  # politics
  '\bпутин', '\bзеленск', '\bнавальн', '\bпрезидент', '\bвыбор[ыа]\b', '\bполитик', '\bгосдум', '\bмитинг', '\bсанкци', '\bтрамп', '\bкремл', '\bукраин',
  # drugs
  '\bнарко', '\bзакладк', '\bкокаин', '\bгероин', '\bмарихуан', '\bспайс', '\bмеф\b', '\bупорот', '\bобдолб',
  # swearing
  '\bху[йяеи]', '\bпизд', '\bеба', '\bебл', '\bеб[уи]', '\bвыеб', '\bзаеб', '\bуеб', '\bбля', '\bсук[аи]\b', '\bмудак', '\bмудил', '\bзалуп', '\bпид[оа]р', '\bгандон', '\bшлюх',
  # discrimination
  '\bхач(и|ик|ей|ам)?\b', '\bчурк', '\bнигг', '\bжид(ы|ов|овск\w*)?\b', '\bхохл', '\bкацап', '\bмоскал',
  # religion
  '\bбог\b', '\bаллах', '\bиисус', '\bхрист', '\bцерк', '\bмечет', '\bислам', '\bправослав', '\bмусульм', '\bрелиги', '\bмолитв',
  # ads of other advertisers (addendum 3: no other banners or ads on these accounts); "erid" marks Russian ads
  '\berid\b', '#реклам', '\bреклама\b', '\bпромокод', '\bспонсор', '#ad\b', '#sponsored', '\bpaid partnership',
  '広告', '#pr\b', 'pr案件', 'タイアップ', 'プロモーション',
  # Japanese (for our own caption pool; plain substrings, Japanese has no word boundaries)
  '政治', '選挙', '首相', '大統領', '戦争', '軍隊', '兵器', '犯罪', '殺人', '暴力', 'ヤクザ', '暴力団',
  '麻薬', '大麻', 'ドラッグ', '差別', '宗教', '神社', '寺院', '教会', '祈り',
]

[dedup]
frames = 5
max_distance = 10                       # mean Hamming distance (bits of 64) to count as duplicate

[download]
proxy = ""                              # optional proxy for anonymous downloads; never an account proxy

[planner]
window_start = "10:00"                  # local time
window_end = "22:00"
min_gap_minutes = 120                   # between posts of one account
lead_minutes = 15                       # do not schedule sooner than now + this
max_source_age_hours = 96               # do not publish memes older than this
cross_account_gap_days = 14             # same source never on two accounts within N days
repost_after_days = 7
repost_max_views = 50000                # only sources whose every publication got fewer views
max_reposts = 1

[publish]
max_per_run = 3
max_delay_hours = 6                     # a slot older than this is failed instead of published late
pause_sec = [1.5, 4.0]                  # random pause between UI actions
typing_delay_ms = [40, 120]
warmup_sec = [5, 15]                    # scroll the feed before posting
between_accounts_sec = [30, 90]
upload_timeout_sec = 300
action_block_pause_hours = 48
require_cover = false                   # true: a post whose cover upload fails is not published

[adspower]
base_url = "http://127.0.0.1:50325"
headless_browser = true
request_interval_sec = 1.1              # AdsPower limits some endpoints to 1 request/second

[apify]
actor = "apify~instagram-reel-scraper"
views_field = "videoPlayCount"
include_shares = false                  # Apify sharesCount add-on (paying users only); feeds trends.share_weight          # verify against the Instagram app in Task 4.1
run_timeout_sec = 900
stats_results_per_account = 100

[notion]
version = "2022-06-28"

[maintenance]
keep_source_days = 30
keep_debug_days = 14                    # screenshots, raw Apify dumps
keep_backups = 14
min_free_disk_gb = 10

[captions]
results_per_donor = 30
fresh_days = 60
min_likes = 1000                        # only popular posts; hidden likes (-1) count as passing
keep_hashtags = true
min_chars = 15
bio_max_chars = 150                     # Instagram bio limit
low_pool_alert = 50                     # per language: daily summary warns below this many free captions
# Removed from the first line of a caption; a bio must not contain any of them anywhere (H10).
# The caption donor's own username and display name are always added to this list.
brand_words = ["公式", "official", "オフィシャル", "®", "™", "Disney", "ディズニー", "Pixar", "ピクサー",
               "Marvel", "マーベル", "Star Wars", "スター・ウォーズ", "Netflix", "ネットフリックス"]
donors_russian = {}                     # owner decision: no Russian caption donors, so no account may use "russian"

# Caption and bio donors by account theme (addendum 1b): each account's captions come only from its theme.
# Approved by the owner 16.11.2026 (existence checked on HypeAuditor / Social Blade / official sites).
[captions.donors_japanese]
cinema = ["disneyjp", "netflixjp", "tokyodisneyresort_official"]
fashion = ["voguejapan", "vivi_mag_official"]
travel = ["visitjapanjp"]               # unverified candidates: "nationalpark_japan", "nihonryokan"
food = ["kurashiru", "delishkitchen.tv"]
anime = ["onepiece_staff"]

[comments]                              # addendum 3: daily comment moderation under our bannered reels
# Only deletes comments. Hiding comments, limiting or turning commenting off is forbidden by Playerok.
days = 30                               # reels younger than this are checked
load_more_clicks = 5                    # "load more comments" presses per reel
max_deletes_per_run = 30                # per account and run, so the account never acts like a bot
# Python regexes, matched against the comment lowercased with "ё" replaced by "е". Tune on the pilot.
link_pattern = '(https?://|www\.|t\.me/|\b[\w-]+\.(ru|com|me|io|link|xyz|top|site|shop)\b)'
spam_patterns = ['подпиш', 'заработ', 'доход', 'в профил', 'в шапке', 'перейди', 'бесплатн', 'промокод',
                 'крипт', 'ставк', 'казино', 'follow me', 'check my', 'dm me', 'earn']
bait_patterns = ['ставь лайк', 'лайк если', 'кто смотрит в 20\d\d', 'like if', 'who.s watching in 20\d\d']
bot_name_pattern = '[a-z]+[._]?[a-z]*\d{5,}'   # usernames like anna_k847310

[[accounts]]
nick = "example_account"
adspower_id = "jabc123"                 # AdsPower profile user_id
background = "assets/backgrounds/example_account"     # circle: an image, or a folder of 9:16 images used in series
                                        # (compose.background_every reels each, by file name); no people or AI characters
daily_limit = 1
caption_lang = "japanese"               # japanese | russian | none (post captions and bio)
theme = "anime"                         # caption/bio theme: a key of captions.donors_<caption_lang> (addendum 1b)
template = "circle"                     # circle (owner, Nov 2026: test reels) | square (video on black)
donor_group = "memes"                   # memes | movies: which video donors feed this account (addendum 2b)
cover = ""                              # "" = circle: the reel's background alone (built next to the reel);
                                        # square: Instagram's frame. A path here overrides it for every reel.
overlay_texts = ["Смотри до конца"]     # optional text plate on the video (Russian, for viewers)
bind_code = ""                          # code from the Playerok bot: the next reel goes out with it as its caption
